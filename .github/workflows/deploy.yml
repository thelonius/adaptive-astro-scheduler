name: Deploy

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # Раньше сборка шла на сервере (docker-compose up --build). На новом хосте
  # 2 ядра и меньше гигабайта свободной памяти при живых соседях (ssd-radar,
  # gpx-tracker, 3x-ui, shadowbox), поэтому vite-сборка переехала в CI.
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            dockerfile: docker/Dockerfile.backend
          - name: frontend
            context: .
            dockerfile: docker/Dockerfile.frontend
          - name: ephemeris
            context: lunar-calendar-api
            dockerfile: lunar-calendar-api/Dockerfile.ephemeris
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:latest
          # Фронт запекает адрес API в бандл на этапе сборки, поэтому публичный
          # URL нужен здесь, а не в рантайме. Переменная репозитория
          # ASTRO_PUBLIC_URL; дефолт — sslip.io-имя амстердамского хоста.
          build-args: |
            VITE_API_URL=${{ vars.ASTRO_PUBLIC_URL || 'https://astro-31-130-130-11.sslip.io:4443' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Прод только n150: API + Postgres (корпус в volume). Веб-морда не деплоится.
  deploy:
    name: Deploy to n150
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Pull images and restart API stack on n150
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          IMAGE_TAG: ${{ github.sha }}
          REMOTE_DIR: ${{ secrets.N150_REMOTE_DIR }}
        with:
          host: ${{ secrets.N150_SSH_HOST }}
          port: ${{ secrets.N150_SSH_PORT }}
          username: ${{ secrets.N150_SSH_USER }}
          key: ${{ secrets.N150_SSH_PRIVATE_KEY }}
          envs: IMAGE_PREFIX,IMAGE_TAG,REMOTE_DIR
          script: |
            set -euo pipefail
            cd "${REMOTE_DIR}"
            COMPOSE="docker compose -p astro -f docker/docker-compose.n150.yml"

            echo "--- git sync ---"
            git fetch origin main
            git reset --hard origin/main

            echo "--- .env image tags ---"
            for f in .env docker/.env; do
              sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${IMAGE_PREFIX}/backend:${IMAGE_TAG}|" "$f"
              sed -i "s|^EPHEMERIS_IMAGE=.*|EPHEMERIS_IMAGE=${IMAGE_PREFIX}/ephemeris:${IMAGE_TAG}|" "$f"
            done

            echo "--- pull & up ---"
            $COMPOSE pull
            $COMPOSE up -d --remove-orphans

            echo "--- migrate (идемпотентно; корпус в volume, не трогаем) ---"
            $COMPOSE exec -T backend sh -c 'cd /app/backend && node dist/database/migrate.js'

            curl -sf http://127.0.0.1:3000/health
            curl -sf http://127.0.0.1:3000/api/corpus/stats | head -c 120
            echo
            $COMPOSE ps
