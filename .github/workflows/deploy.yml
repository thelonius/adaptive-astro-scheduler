name: Deploy

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [] # runs independently; CI is a separate workflow

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync server to origin/main and rebuild containers
        uses: appleboy/ssh-action@v1
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: NVIDIA_API_KEY
          script: |
            set -e
            cd ${{ secrets.SSH_DEPLOY_PATH }}

            # Sync working tree to origin/main via git, not rsync.
            # rsync left .git untouched and the working tree drifted from the
            # index — modified + untracked entries that were actually just
            # main's content rsynced over an old HEAD. reset --hard + clean -fd
            # is idempotent and respects .gitignore (so .env, node_modules,
            # dist, venv, __pycache__ stay put).
            echo "--- Syncing repo to origin/main ---"
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            # Persist secrets to .env so docker-compose's ${VAR:-} substitution
            # picks them up — both for this deploy and for any future manual
            # `docker-compose restart` after an SSH session.
            umask 077
            cat > .env <<EOF
            NVIDIA_API_KEY=${NVIDIA_API_KEY}
            EOF
            umask 022

            echo "--- Stopping containers ---"
            docker-compose -f docker/docker-compose.yml down

            # Prune BEFORE the build, not after. The previous trailing prune
            # only ran on success — when a build OOM'd on disk, old layers
            # piled up and the next deploy hit the same wall. With down
            # already done, every old image is unused, so -af is safe.
            echo "--- Pruning old images and build cache ---"
            docker image prune -af
            docker builder prune -af

            echo "--- Building and starting ---"
            docker-compose -f docker/docker-compose.yml up -d --build --force-recreate

            echo "--- Running migrations ---"
            docker-compose -f docker/docker-compose.yml exec -T backend npm run migrate 2>/dev/null || true

            echo "--- Deploy complete: $(date) ---"
            docker-compose -f docker/docker-compose.yml ps
