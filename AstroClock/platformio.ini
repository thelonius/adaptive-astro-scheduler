; Часы AstroClock: ESP32-C3 + круглый GC9A01 240x240.
;
; Эфемериды считаются на устройстве (src/ephemeris.h), сервер и JSON больше не
; нужны. WiFi подключается только ради NTP и только если задана переменная
; окружения ASTRO_WIFI_SSID, иначе стек в образ не линкуется.
;
; Натальные данные задаются build-флагами: клавиатуры у устройства нет, а
; владелец один. Сами значения лежат в secrets.ini рядом с этим файлом, потому
; что репозиторий публичный. Шаблон — secrets.ini.example.

[platformio]
; Глоб, а не имя файла: без secrets.ini сборка должна проходить. Тогда
; работают запасные значения из src/config.h — эпоха J2000 и нулевые
; координаты, то есть заведомо чужая карта, но собранная прошивка.
extra_configs = secrets*.ini

[personal]
; Переопределяется секцией [personal] из secrets.ini.
build_flags =

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

lib_deps =
    lovyan03/LovyanGFX @ ^1.1.12

; Разметка на два слота по 1.875 МБ вместо 1.25: полные тексты толкований
; (495 КБ) вместе с WiFi и OTA в стандартную default.csv не влезали. SPIFFS
; ужимается до 128 КБ, файловой системой прошивка не пользуется.
board_build.partitions = min_spiffs.csv

extra_scripts = pre:tools/build_flags.py

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ${personal.build_flags}

; Заливка по воздуху вместо USB. Требует ASTRO_WIFI_SSID и ASTRO_OTA=1 в
; окружении (см. tools/build_flags.py) — без них соберётся то же самое, что
; в esp32-c3-devkitm-1, но не будет что слушать на этот адрес.
; Пароль OTA, если задан через ASTRO_OTA_PASS, PlatformIO сюда статически не
; подставить: он передаётся заливщику через переменную окружения
; PLATFORMIO_UPLOAD_FLAGS="--auth=..." в момент запуска upload.
[env:ota]
extends = env:esp32-c3-devkitm-1
upload_protocol = espota
upload_port = astroclock.local
