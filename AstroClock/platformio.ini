; Часы AstroClock. Две платы:
;   amoled143            — LilyGO T-Display S3 AMOLED 1.43, ESP32-S3R8 + 466x466
;   esp32-c3-devkitm-1   — первые часы, ESP32-C3 + круглый GC9A01 240x240
; Чем платы отличаются, собрано в src/board.h.
;
; Эфемериды считаются на устройстве (src/ephemeris.h), сервер и JSON больше не
; нужны. WiFi подключается только ради NTP (плюс по команде с телефона через
; BLE, см. src/wifi_task.h) и только если задана переменная окружения
; ASTRO_WIFI_SSID, иначе стек в образ не линкуется.
;
; BLE (src/ble.h, docs/ble-protocol.md) собирается всегда, без отдельного
; флага: в отличие от WiFi он не требует секретов, а флеш-бюджета хватает с
; запасом даже вместе с WiFi+OTA (NimBLE компактнее штатного Bluedroid-стека).
;
; Натальные данные задаются build-флагами: клавиатуры у устройства нет, а
; владелец один. Сами значения лежат в secrets.ini рядом с этим файлом, потому
; что репозиторий публичный. Шаблон — secrets.ini.example.

[platformio]
; Глоб, а не имя файла: без secrets.ini сборка должна проходить. Тогда
; работают запасные значения из src/config.h — эпоха J2000 и нулевые
; координаты, то есть заведомо чужая карта, но собранная прошивка.
extra_configs = secrets*.ini

[personal]
; Переопределяется секцией [personal] из secrets.ini.
build_flags =

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

lib_deps =
    lovyan03/LovyanGFX @ ^1.1.12
    h2zero/NimBLE-Arduino @ ^2.5

; Разметка на два слота по 1.875 МБ вместо 1.25: полные тексты толкований
; (495 КБ) вместе с WiFi и OTA в стандартную default.csv не влезали. SPIFFS
; ужимается до 128 КБ, файловой системой прошивка не пользуется.
board_build.partitions = min_spiffs.csv

extra_scripts = pre:tools/build_flags.py

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; Один центральный (телефон) одновременно — на большее NVS-бюджет под
    ; bond-записи и не рассчитан ("владелец один", см. config.h). Роль
    ; central часам не нужна вообще: они только периферийное устройство
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    ${personal.build_flags}

; Заливка по воздуху вместо USB. Требует ASTRO_WIFI_SSID и ASTRO_OTA=1 в
; окружении (см. tools/build_flags.py) — без них соберётся то же самое, что
; в esp32-c3-devkitm-1, но не будет что слушать на этот адрес.
; Пароль OTA, если задан через ASTRO_OTA_PASS, PlatformIO сюда статически не
; подставить: он передаётся заливщику через переменную окружения
; PLATFORMIO_UPLOAD_FLAGS="--auth=..." в момент запуска upload.
[env:ota]
extends = env:esp32-c3-devkitm-1
upload_protocol = espota
upload_port = astroclock.local

; LilyGO T-Display S3 AMOLED 1.43: 16 МБ флеша и 8 МБ PSRAM, поэтому полный
; кадр 466x466 и сглаженные шрифты (src/fonts, tools/gen_fonts.py) влезают
; без ужимания разметки. Панель CO5300 (DO0143FMST10); для партии на SH8601
; (DO0143FAT01) добавить -D AMOLED_SH8601.
[env:amoled143]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

lib_deps = ${env:esp32-c3-devkitm-1.lib_deps}
extra_scripts = pre:tools/build_flags.py

build_flags =
    -D BOARD_AMOLED143
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    ${personal.build_flags}

[env:amoled143-ota]
extends = env:amoled143
upload_protocol = espota
upload_port = astroclock.local
