# Приватный SearXNG для openclaw на n150.
#
# Слушает 127.0.0.1:8888 и наружу не публикуется: это поисковый бэкенд
# агента, а не сайт. Публичные инстансы SearXNG почти все режут ?format=json
# и лимитируют по IP, поэтому свой.
#
# Старт:  ./scripts/deploy-searxng-n150.sh
#         docker compose -f docker/searxng/docker-compose.yml up -d
# Логи:   docker logs -f openclaw_searxng
# Проверка: curl -s http://127.0.0.1:8888/healthz

services:
  searxng:
    image: searxng/searxng:latest
    container_name: openclaw_searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://localhost:8888/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?run ./init.sh once to generate .env}
      UWSGI_WORKERS: "2"
      UWSGI_THREADS: "4"
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
