# Приватный SearXNG для openclaw на n150.
#
# 127.0.0.1:8888 — только loopback (OpenClaw, Claude на сервере).
# :8890 + profile clients — HTTP Basic Auth для Mac/телефона/Cursor в LAN (см. REMOTE_ACCESS.md).
#
# Старт:  ./scripts/deploy-searxng-n150.sh
# Клиенты: ./docker/searxng/init-clients.sh && docker compose -f docker/searxng/docker-compose.yml --profile clients up -d

services:
  searxng:
    image: searxng/searxng:latest
    container_name: openclaw_searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://localhost:8888/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?run ./init.sh once to generate .env}
      UWSGI_WORKERS: "2"
      UWSGI_THREADS: "4"
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - searxng_internal

  searxng-gateway:
    profiles: [clients]
    image: caddy:2-alpine
    container_name: openclaw_searxng_gateway
    restart: unless-stopped
    ports:
      - "${SEARXNG_CLIENT_BIND:-127.0.0.1:8890}:8890"
    volumes:
      - ./Caddyfile.clients:/etc/caddy/Caddyfile:ro
    depends_on:
      searxng:
        condition: service_healthy
    mem_limit: 64m
    networks:
      - searxng_internal

networks:
  searxng_internal:
    driver: bridge
