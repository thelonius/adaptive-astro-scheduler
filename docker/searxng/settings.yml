# SearXNG для openclaw на n150. Инстанс приватный, слушает только localhost.
#
# Главное здесь — formats с json. По умолчанию SearXNG отдаёт только html,
# и запрос с &format=json возвращает 403. Без этой строки скилл websearch не работает.

use_default_settings: true

general:
  instance_name: "openclaw-search"
  donation_url: false
  contact_url: false
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: ""
  formats:
    - html
    - json

server:
  # secret_key намеренно не задан: образ подставляет его из переменной
  # SEARXNG_SECRET (см. .env). YAML сам по себе переменные не раскрывает,
  # и строка "${SEARXNG_SECRET}" уехала бы в конфиг буквально.
  limiter: false
  image_proxy: false
  method: "GET"

ui:
  static_use_hash: true

outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true
