# Астро на n150-server2 (developer@95.165.10.115:22299), домашний сервер Mattahu.
# Машина чужая и предназначена под svland, поэтому здесь минимальный набор.
#
# Отличия от docker-compose.prod.yml (амстердамский бокс):
#  - нет frontend и сети astro_edge: веб-морда не разворачивается, единственный
#    потребитель API — openclaw с той же машины
#  - backend публикуется на 127.0.0.1, а не на всех интерфейсах. Наружу отдаётся
#    только 18082 и только с прокси 192.168.1.98, лезть в этот периметр незачем
#  - лимиты памяти подняты: на боксе 15 ГБ против 2 ГБ в Амстердаме. Совсем
#    снимать их не стоит, сосед по машине не должен страдать, если астро потечёт
#
# Перед первым запуском проверить, что порт из ASTRO_BIND_PORT свободен:
#   ss -lntp | grep 3000
#
# Запуск:
#   cd ~/apps/astro && docker compose -f docker/docker-compose.n150.yml pull
#   docker compose -f docker/docker-compose.n150.yml up -d

services:
  postgres:
    image: postgres:15-alpine
    container_name: astro_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: adaptive_astro
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    container_name: astro_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 192m
    restart: unless-stopped

  ephemeris:
    image: ${EPHEMERIS_IMAGE:?set EPHEMERIS_IMAGE in .env}
    container_name: astro_ephemeris
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_RELOAD: "false"
      PROJECT_NAME: Lunar Calendar & Ephemeris API
      VERSION: "1.0.0"
      API_V1_PREFIX: /api/v1
      PYTHONUNBUFFERED: "1"
    volumes:
      - ephemeris_cache:/tmp/skyfield-cache
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    mem_limit: 768m
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE in .env}
    container_name: astro_backend
    # Только loopback: openclaw ходит на http://localhost:3000, из сети порт
    # недоступен. Формат bind-адреса менять осознанно
    ports:
      - "127.0.0.1:${ASTRO_BIND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/adaptive_astro
      REDIS_URL: redis://redis:6379
      EPHEMERIS_MODE: api
      EPHEMERIS_API_URL: http://ephemeris:8000
      # Встроенный бот проекта выключен: его токен утёк и отозван, телеграм-
      # интерфейсом служит openclaw. Пустая строка намеренная, telegram-bot.service
      # делает deleteWebhook() на старте
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_WEBHOOK_URL: ""
      # Веб-морды нет, браузер сюда не ходит. Оставлено на случай отладки с хоста
      CORS_ORIGIN: ${ASTRO_PUBLIC_URL:-http://localhost:3000}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-nvidia/llama-3.3-nemotron-super-49b-v1.5}
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: adaptive_astro
      PGHOST: postgres
      PGPORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ephemeris:
        condition: service_healthy
    mem_limit: 768m
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  ephemeris_cache:

networks:
  default:
    name: astro_network
